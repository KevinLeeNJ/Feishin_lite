[workspace]
members = ["crates/desktop-core", "crates/audio-engine"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
cpal = "=0.18.2"
serde_json = "=1.0.149"
serde = { version = "1", features = ["derive"] }
symphonia = { version = "=0.5.5", features = ["all"] }
ringbuf = "=0.4.8"
rubato = { version = "=0.16.2", default-features = false }
stream-download = { version = "=0.24.4", default-features = false, features = ["reqwest-rustls", "temp-storage"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
tokio-util = "0.7"
ssstretch = "=0.1.0"
biquad = "=0.6.0"
dsp-core = "=0.1.1"
